name: gameeval
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gameeval
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD (hex characters)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    networks: [backend]
    labels: { traefik.enable: 'false' }
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d gameeval']
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    image: gameeval-studio:1.1.0
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?Set public HTTPS origin}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      DATABASE_URL: postgres://gameeval:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/gameeval
      PORT: 3000
    depends_on:
      db: { condition: service_healthy }
    # Loopback is for diagnostics only; the public entrypoint is Traefik HTTPS.
    ports: [127.0.0.1:3000:3000]
    networks: [backend]
    labels: { traefik.enable: 'false' }
    restart: unless-stopped
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
volumes:
  postgres-data:
networks:
  backend: { internal: true }
